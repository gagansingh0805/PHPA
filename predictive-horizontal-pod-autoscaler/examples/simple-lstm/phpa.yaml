apiVersion: gagansingh.dev/v1alpha1
kind: PredictiveHorizontalPodAutoscaler
metadata:
  name: simple-lstm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: php-apache
  minReplicas: 1
  maxReplicas: 25
  syncPeriod: 15000
  decisionType: maximum
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          averageUtilization: 50
          type: Utilization
  models:
    - type: LSTM
      name: stacked-lstm-surge-preemption
      calculationTimeout: 10000
      lstm:
        historySize: 12
        lookAhead: 45000

